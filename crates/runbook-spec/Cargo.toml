[package]
name = "runbook-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
runbook-model = { path = "../runbook-model" }
runbook-expr = { path = "../runbook-expr" }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
yaml-rust2 = { version = "0.10", default-features = false }
# Size (cf-size): on wasm (the api Worker, the browser compiler) regex
# runs without its `perf-*` engines (lazy DFA, one-pass, backtracker,
# literal prefilters): the same matches, by the regex crate's guarantee, in
# much less code. Native keeps `perf` (the target section below).
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# LANG9b: schedule triggers' cron times in a named time zone. Both are
# already in every build through the expression engine (cel-core).
chrono = { version = "0.4", default-features = false }
chrono-tz = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

[dev-dependencies]
jsonschema = { version = "0.61.0", default-features = false, features = ["arbitrary-precision"] }
