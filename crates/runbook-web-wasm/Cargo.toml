[package]
name = "runbook-web-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"
description = "The browser compiler: validate, outline and describe over a JSON-in/JSON-out Wasm ABI."

[lib]
# cdylib is the browser module; rlib lets native tests call the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
runbook-model = { path = "../runbook-model" }
runbook-spec = { path = "../runbook-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
runbook-api = { path = "../runbook-api" }
