[package]
name = "runbook-worker-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"
description = "CF2: the ExecutionDO store's test suite, natively over SQLite and inside workerd as a test-only Worker, one RPC per case (local only)."

[lib]
# cdylib is the test Worker built by worker-build; rlib lets native tests
# check its case registry.
crate-type = ["cdylib", "rlib"]

[dependencies]
runbook-core = { path = "../runbook-core" }
runbook-model = { path = "../runbook-model" }
runbook-store-conformance = { path = "../runbook-store-conformance" }
runbook-store-do = { path = "../runbook-store-do" }
runbook-store-r2 = { path = "../runbook-store-r2" }
runbook-store-d1 = { path = "../runbook-store-d1" }
# CF5: the composed Cloudflare store and its object protocol, for the
# cross-store tiers. Without `edge`: this Worker has its own entry points.
runbook-worker = { path = "../runbook-worker", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# The native host: in-memory SQLite. rusqlite 0.41.1 (MIT) is the newest
# release that has settled; `bundled` compiles SQLite (public domain) with cc.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "limits"] }
runbook-store-d1 = { path = "../runbook-store-d1", features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7" }
wasm-bindgen = "0.2.129"

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
