[package]
name = "runbook-store-objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
object_store = { version = "=0.14.2", default-features = false, features = ["aws", "gcp"] }
percent-encoding = "=2.3.2"
runbook-core = { path = "../runbook-core" }
runbook-model = { path = "../runbook-model" }
serde = "1"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
tokio-postgres = "=0.7.18"
bytes = "1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
