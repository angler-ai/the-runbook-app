[package]
name = "runbook-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
# CF12c: `logs::batches` redacts a line too large for one request with
# core's redactor (the server's) before cutting it. Already in every build
# that has this crate (the CLI, runbook-api and through it the api Worker
# and the browser compiler), so no new code reaches them.
runbook-core = { path = "../runbook-core" }
serde_json = "1"
# CF12b review round 2: `logs::sub_key` hashes a long idempotency key
# (already locked and in the api Worker through runbook-core).
sha2 = { version = "0.10", default-features = false }
# CF7: tool arguments are checked by `schema.rs` (the catalog's keyword
# subset); `jsonschema` is a test-only reference.
# Size (cf-size): on wasm (the api Worker, the browser compiler) regex
# runs without its `perf-*` engines (lazy DFA, one-pass, backtracker,
# literal prefilters): the same matches, by the regex crate's guarantee, in
# much less code. Native keeps `perf` (the target section below).
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

[dev-dependencies]
jsonschema = { version = "0.61.0", default-features = false }
