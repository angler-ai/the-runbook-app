[package]
name = "runbook-store-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
runbook-core = { path = "../runbook-core" }
runbook-engine = { path = "../runbook-engine" }
runbook-model = { path = "../runbook-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio-postgres = "=0.7.18"
tokio = { version = "=1.54.1", features = ["rt", "time", "macros", "sync"] }
native-tls = "=0.2.18"
postgres-native-tls = "=0.5.3"
sha2 = { version = "0.10", default-features = false }
# UI-1b: the runbook list streams rows (already a dev-dependency here and in
# the lock; MIT OR Apache-2.0).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
runbook-store-objects = { path = "../runbook-store-objects" }

[dev-dependencies]
runbook-engine = { path = "../runbook-engine" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.10", default-features = false }
runbook-spec = { path = "../runbook-spec" }
runbook-store-conformance = { path = "../runbook-store-conformance" }
object_store = { version = "=0.14.2", default-features = false }
