[package]
name = "runbook-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
runbook-engine = { path = "../runbook-engine" }
runbook-model = { path = "../runbook-model" }
runbook-spec = { path = "../runbook-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = { version = "0.10", default-features = false }
yaml-rust2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
fluent-uri = { version = "=0.4.1", default-features = false }
# ARC1 (D53): deterministic daily archive ZIPs, deflate through flate2's
# pure-Rust backend (miniz_oxide); no time, crypto or C codecs.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

[dev-dependencies]
# REP2 golden-structure tests read the PDF export of the flagship document.
runbook-report-pdf = { path = "../runbook-report-pdf" }
