[package]
name = "runbook-store-r2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"
description = "CF4: BlobStore on object storage (R2): the BlobKey layout, tenancy and immutability over a small bucket trait; Workers and in-memory buckets."

[dependencies]
runbook-core = { path = "../runbook-core" }
runbook-model = { path = "../runbook-model" }

# The R2 bucket exists only on wasm32, pinned with runbook-worker (D55).
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7" }
