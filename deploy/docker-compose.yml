# The Runbook native pilot: runbook-server on PostgreSQL 16.
#
#   cp deploy/.env.example deploy/.env      # then fill in the two secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env exec server \
#     runbook-server bootstrap --owner-email you@example.test
#
# PostgreSQL sits on an internal-only network and is never published to the
# host. The server publishes one port, on loopback by default; put a TLS
# reverse proxy in front of it before exposing it beyond this machine.
# See deploy/README.md.
name: runbook

include:
  - docker-compose.runner.yml

services:
  postgres:
    # postgres:16-alpine, pinned to the multi-platform digest it resolved
    # to when this file was last updated; bump both together.
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      # The administrator (a superuser): backups and maintenance only.
      POSTGRES_USER: ${POSTGRES_USER:-runbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see deploy/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-runbook}
      # The unprivileged role the server connects as; postgres-init creates
      # it, owning the runbook schema, on the volume's first start.
      RUNBOOK_DB_USER: ${RUNBOOK_DB_USER:-runbook_app}
      RUNBOOK_DB_PASSWORD: ${RUNBOOK_DB_PASSWORD:?set RUNBOOK_DB_PASSWORD (see deploy/.env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Hardening: read-only root, only the capabilities the entrypoint needs
    # to fix volume ownership and drop to the postgres user, no privilege
    # gain, bounded memory and processes.
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    pids_limit: 200
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  server:
    image: ${RUNBOOK_IMAGE:-runbook-pilot:local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        RUNBOOK_CACHE_ID: ${RUNBOOK_CACHE_ID:-default}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password is interpolated into a URL: use URL-safe characters
      # (for example `openssl rand -hex 24`).
      DATABASE_URL: postgres://${RUNBOOK_DB_USER:-runbook_app}:${RUNBOOK_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-runbook}
      RUNBOOK_ORIGIN: ${RUNBOOK_ORIGIN:-http://localhost:8080}
      RUNBOOK_LISTEN_ADDR: 0.0.0.0:8080
      RUNBOOK_RUNNER_PRIVATE_NETWORKS: ${RUNBOOK_RUNNER_PRIVATE_NETWORKS:-false}
      RUNBOOK_WEBHOOK_SECRET_KEY: ${RUNBOOK_WEBHOOK_SECRET_KEY:?set RUNBOOK_WEBHOOK_SECRET_KEY (openssl rand -base64 32)}
      RUNBOOK_ALLOW_PRIVATE_WEBHOOK_TARGETS: ${RUNBOOK_ALLOW_PRIVATE_WEBHOOK_TARGETS:-false}
      RUNBOOK_ALLOW_LINK_LOCAL_WEBHOOK_TARGETS: ${RUNBOOK_ALLOW_LINK_LOCAL_WEBHOOK_TARGETS:-false}
      # The web UI the image ships, on the API's origin. On by default; set
      # RUNBOOK_WEB_DIR= (empty) to serve the API alone.
      RUNBOOK_WEB_DIR: ${RUNBOOK_WEB_DIR-/usr/share/runbook/web}
      # Sign-in (D48). Off until RUNBOOK_AUTH_SECRET is set; email codes need
      # RUNBOOK_SMTP_URL and RUNBOOK_SMTP_FROM, Google needs both client
      # values. Unset values arrive empty, which means unset. See .env.example.
      RUNBOOK_AUTH_SECRET: ${RUNBOOK_AUTH_SECRET:-}
      RUNBOOK_AUTH_METHODS: ${RUNBOOK_AUTH_METHODS:-}
      RUNBOOK_AUTH_ALLOWED_DOMAINS: ${RUNBOOK_AUTH_ALLOWED_DOMAINS:-}
      # The TLS proxy in front, whose X-Forwarded-For names the client for
      # per-IP limits. Empty trusts none. See .env.example.
      RUNBOOK_TRUSTED_PROXIES: ${RUNBOOK_TRUSTED_PROXIES:-}
      RUNBOOK_SMTP_URL: ${RUNBOOK_SMTP_URL:-}
      RUNBOOK_SMTP_FROM: ${RUNBOOK_SMTP_FROM:-}
      RUNBOOK_GOOGLE_CLIENT_ID: ${RUNBOOK_GOOGLE_CLIENT_ID:-}
      RUNBOOK_GOOGLE_CLIENT_SECRET: ${RUNBOOK_GOOGLE_CLIENT_SECRET:-}
      # Evidence uploads (D49–D51). Off until RUNBOOK_USERCONTENT_ORIGIN and
      # RUNBOOK_UPLOAD_SIGNING_KEY are set. User files are served from their
      # own origin by a second listener on 8081 (D50), published as
      # RUNBOOK_USERCONTENT_HOST_PORT; it answers nothing else.
      RUNBOOK_UPLOAD_SIGNING_KEY: ${RUNBOOK_UPLOAD_SIGNING_KEY:-}
      RUNBOOK_USERCONTENT_ORIGIN: ${RUNBOOK_USERCONTENT_ORIGIN:-}
      RUNBOOK_USERCONTENT_LISTEN_ADDR: 0.0.0.0:8081
      # Theme colours (UI-1), each #rrggbb; empty means the web app's own.
      # An invalid value refuses startup. See .env.example.
      RUNBOOK_THEME_ACCENT: ${RUNBOOK_THEME_ACCENT:-}
      RUNBOOK_THEME_ACCENT_SECONDARY: ${RUNBOOK_THEME_ACCENT_SECONDARY:-}
      RUNBOOK_THEME_DARK_ACCENT: ${RUNBOOK_THEME_DARK_ACCENT:-}
      RUNBOOK_THEME_DARK_ACCENT_SECONDARY: ${RUNBOOK_THEME_DARK_ACCENT_SECONDARY:-}
    # Webhook receivers on the Docker host are http://host.docker.internal:<port>
    # (with RUNBOOK_ALLOW_PRIVATE_WEBHOOK_TARGETS=true). Docker Desktop
    # provides the name; this maps it to the host gateway on native Linux,
    # where the receiver must listen on a non-loopback interface (0.0.0.0 or
    # the bridge address).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RUNBOOK_BIND_ADDRESS:-127.0.0.1}:${RUNBOOK_HOST_PORT:-8080}:8080"
      - "${RUNBOOK_BIND_ADDRESS:-127.0.0.1}:${RUNBOOK_USERCONTENT_HOST_PORT:-8081}:8081"
    # Hardening: the server writes nothing to its filesystem (state is in
    # PostgreSQL); /tmp and the CLI's home are small in-memory mounts. No
    # capabilities, no privilege gain, bounded memory and processes.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /home/runbook:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${RUNBOOK_MEMORY_LIMIT:-1g}
    pids_limit: 200
    networks:
      internal: {}
      edge: {}
      runner-vault-core:
        aliases: [runner-core]

  # Test-only mail catcher for the smoke tests (deploy/smoke/sign_in.sh):
  # started only with `--profile smoke`, never by a plain `up`. The server
  # sends codes to smtp://mailpit:1025; the HTTP API is published on
  # loopback only (RUNBOOK_MAILPIT_PORT, default 8025).
  mailpit:
    profiles: [smoke]
    # axllent/mailpit:v1.33.1, pinned to the multi-platform digest it
    # resolved to when this file was last updated; bump both together.
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:${RUNBOOK_MAILPIT_PORT:-8025}:8025"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    networks:
      - edge

volumes:
  pgdata:

networks:
  # No route out: only the server reaches PostgreSQL.
  internal:
    internal: true
  # The published port and outbound webhook deliveries.
  edge: {}
