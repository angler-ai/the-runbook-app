name: Docs

# The docs site (site/, DOCS1): regenerate the CLI, MCP, environment, key,
# diagnostics, webhook event and samples pages from the code and fail if the
# committed pages are stale, validate every sample and example runbook, run
# the site's script tests (including the webhook signature samples), and
# build the site, which checks every internal link. On a push to main in the
# public repository, the built site goes to GitHub Pages, served at
# docs.therunbook.app (the custom domain is set in the repository's Pages
# settings, and DNS points docs.therunbook.app at angler-ai.github.io).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/runbook-cli/**'
      - 'crates/runbook-mcp/**'
      - 'crates/runbook-spec/**'
      - 'crates/runbook-expr/src/**'
      - 'crates/runbook-core/src/**'
      - 'crates/runbook-api/src/**'
      - 'crates/runbook-server/src/**'
      - 'crates/runbook-store-*/src/**'
      - 'deploy/.env.example'
      - 'scripts/dev/review-runbooks/**'
      - 'docs/release-notes.md'
      - 'api/openapi.draft.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'crates/runbook-cli/**'
      - 'crates/runbook-mcp/**'
      - 'crates/runbook-spec/**'
      - 'crates/runbook-expr/src/**'
      - 'crates/runbook-core/src/**'
      - 'crates/runbook-api/src/**'
      - 'crates/runbook-server/src/**'
      - 'crates/runbook-store-*/src/**'
      - 'deploy/.env.example'
      - 'scripts/dev/review-runbooks/**'
      - 'docs/release-notes.md'
      - 'api/openapi.draft.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # Same action tags as the repository's other workflows (core.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Install rustup if the runner lacks it
        if: ${{ github.event.repository.private }}
        run: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Build the CLI
        run: cargo build --locked -p runbook-cli
      - name: Install site dependencies without lifecycle scripts
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Generated pages are up to date
        working-directory: site
        env:
          RUNBOOK_BIN: ../target/debug/runbook
        run: npm run check:generated
      - name: Sample runbooks validate
        working-directory: site
        env:
          RUNBOOK_BIN: ../target/debug/runbook
        run: npm run check:samples
      - name: Script tests and signature samples
        working-directory: site
        run: node --test scripts/tests/*.test.mjs
      - name: Build the site and check its links
        working-directory: site
        run: npm run build
      - name: Upload the site for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: check
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # A deploy that has started finishes, even when a newer push arrives.
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
