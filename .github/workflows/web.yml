name: Web

# The web UI check set (web/): API schema drift, lint, typecheck, Vitest,
# node --test, and the production build. Dependencies install with
# --ignore-scripts (F102); see web/README.md "Install scripts".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi.draft.json'
      - 'api/examples/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'api/openapi.draft.json'
      - 'api/examples/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

# One run per workflow and branch: a newer push cancels the older run, so
# the self-hosted runner doesn't queue stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      # Same action tags as the repository's other workflows (core.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check
        run: npm run check
