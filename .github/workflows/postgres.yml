name: Postgres

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per workflow and branch: a newer push cancels the older run, so
# the self-hosted runner doesn't queue stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The service publishes 5432 on a random host port, so jobs never
      # collide with a Postgres already on the runner or with each other.
      - name: Point DATABASE_URL at the service's host port
        run: echo "DATABASE_URL=postgres://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable" >> "$GITHUB_ENV"
      # While the repo is private, jobs run on the default self-hosted runner,
      # which may not have rustup yet; GitHub's images already do.
      - name: Install rustup if the runner lacks it
        if: ${{ github.event.repository.private }}
        run: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # The sign-in tests (runbook-server tests/auth_service.rs) run the real
      # auth service, so build its bundle first.
      - name: Install Node for the auth service
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          package-manager-cache: false
      - name: Build the auth service bundle
        working-directory: auth
        run: npm ci --ignore-scripts && npm run build
      - name: Adapter bootstrap, conformance, fault and restart cases
        run: cargo test -p runbook-store-postgres --locked -- --include-ignored
      # tests/manifest.rs rewrites the manifest from the migrated schema; the
      # committed copy (the D1 parity test reads it) must already match.
      - name: The committed Postgres manifest is current
        run: git diff --exit-code -- cloudflare/migrations/postgres-manifest.json
      - name: Local server bootstrap and doctor
        run: cargo test -p runbook-server --locked -- --include-ignored
      - name: CLI end to end (agent loop, stdio and /mcp parity)
        run: cargo test -p runbook-cli --locked -- --include-ignored
