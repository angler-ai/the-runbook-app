name: PR Description
on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  update-pr-desc:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: jonathansudhakar1/gemini-pr-description@1a876cfedc26d45d55b937a0115667dcb038978b # v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          update_mode: smart
